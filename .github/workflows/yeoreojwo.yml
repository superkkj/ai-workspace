name: Yeoreojwo checks

on:
  push:
    paths:
      - 'apps/yeoreojwo/**'
      - '.github/workflows/yeoreojwo.yml'
  pull_request:
    paths:
      - 'apps/yeoreojwo/**'
      - '.github/workflows/yeoreojwo.yml'

permissions:
  contents: read

concurrency:
  group: yeoreojwo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/yeoreojwo
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/yeoreojwo/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check types
        run: npm run typecheck
      - name: Check behavior and database rules
        run: npm test
      - name: Build
        run: npm run build
