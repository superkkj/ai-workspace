name: Yeoreojwo checks

on:
  push:
    paths:
      - 'apps/yeoreojwo/**'
      - '.github/workflows/yeoreojwo.yml'
  pull_request:
    paths:
      - 'apps/yeoreojwo/**'
      - '.github/workflows/yeoreojwo.yml'

permissions:
  contents: read

concurrency:
  group: yeoreojwo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/yeoreojwo
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/yeoreojwo/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check types
        run: npm run typecheck
      - name: Check behavior and database rules
        run: npm test
      - name: Build
        run: npm run build
      - name: Prepare local D1 for HTTP checks
        run: node --import ./scripts/sites-env.mjs ./node_modules/wrangler/bin/wrangler.js d1 execute DB --local --config dist/server/wrangler.json --persist-to .wrangler/state --file drizzle/0000_famous_toro.sql
      - name: Check HTTP API with local D1
        shell: bash
        run: |
          npm run start -- --port 4173 --log-level debug > "$RUNNER_TEMP/yeoreojwo-http-server.log" 2>&1 &
          ci_server_pid=$!
          trap 'kill "$ci_server_pid" 2>/dev/null || true' EXIT
          node --input-type=module <<'NODE'
          import { setTimeout } from 'node:timers/promises';
          let consecutiveHealthy = 0;
          let lastFailure = 'No healthy response yet';
          for (let attempt = 0; attempt < 60 && consecutiveHealthy < 10; attempt++) {
            try {
              const response = await fetch('http://127.0.0.1:4173/api/platform', { signal: AbortSignal.timeout(2000) });
              const snapshot = await response.json();
              if (!response.ok || !Array.isArray(snapshot.requests) || !snapshot.serverTime) {
                throw new Error(`API readiness returned HTTP ${response.status}`);
              }
              consecutiveHealthy++;
            } catch (error) {
              consecutiveHealthy = 0;
              lastFailure = String(error);
            }
            await setTimeout(500);
          }
          if (consecutiveHealthy < 10) throw new Error(`Local HTTP API did not stabilize: ${lastFailure}`);
          const probeHeaders = {
            'Content-Type': 'application/json',
            Origin: 'http://127.0.0.1:4173',
            'oai-authenticated-user-id': 'ci-read-only-diagnostic',
            'oai-authenticated-user-email': 'ci-read-only-diagnostic@example.invalid',
          };
          for (const body of ['{', '{"action":"diagnostic-unknown","requestId":"no-record"}']) {
            const response = await fetch('http://127.0.0.1:4173/api/platform', {
              method: 'POST', headers: probeHeaders, body, signal: AbortSignal.timeout(5000),
            });
            console.log('Non-mutating body diagnostic:', response.status, (await response.text()).slice(0,300));
          }
          NODE
          npm run test:http -- http://127.0.0.1:4173
      - name: Show local server diagnostics on failure
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/yeoreojwo-http-server.log" ]; then
            tail -n 300 "$RUNNER_TEMP/yeoreojwo-http-server.log"
          fi
