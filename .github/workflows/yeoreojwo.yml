name: Yeoreojwo checks

on:
  push:
    paths:
      - 'apps/yeoreojwo/**'
      - '.github/workflows/yeoreojwo.yml'
      - '.github/tools/yeoreojwo-http-runtime/**'
  pull_request:
    paths:
      - 'apps/yeoreojwo/**'
      - '.github/workflows/yeoreojwo.yml'
      - '.github/tools/yeoreojwo-http-runtime/**'

permissions:
  contents: read

concurrency:
  group: yeoreojwo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      YEOREOJWO_WRANGLER_CLI: ${{ github.workspace }}/.github/tools/yeoreojwo-http-runtime/node_modules/wrangler/bin/wrangler.js
    defaults:
      run:
        working-directory: apps/yeoreojwo
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            apps/yeoreojwo/package-lock.json
            .github/tools/yeoreojwo-http-runtime/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install isolated HTTP test runtime
        working-directory: .github/tools/yeoreojwo-http-runtime
        run: npm ci --no-audit --no-fund
      - name: Check types
        run: npm run typecheck
      - name: Check behavior and database rules
        run: npm test
      - name: Build
        run: npm run build
      - name: Adapt generated config for local HTTP runtime
        run: node "$GITHUB_WORKSPACE/.github/tools/yeoreojwo-http-runtime/prepare-config.mjs" dist/server/wrangler.json
      - name: Prepare local D1 for HTTP checks
        run: node --import ./scripts/sites-env.mjs "$YEOREOJWO_WRANGLER_CLI" d1 execute DB --local --config dist/server/wrangler.json --persist-to .wrangler/state --file drizzle/0000_famous_toro.sql
      - name: Check HTTP API with local D1
        shell: bash
        run: |
          # Use the pinned runtime containing the unread-body connection fix.
          # Keep the generated no_bundle artifact unchanged for these checks.
          # https://github.com/cloudflare/workers-sdk/issues/15203
          node --import ./scripts/sites-env.mjs "$YEOREOJWO_WRANGLER_CLI" --version
          node --import ./scripts/sites-env.mjs "$YEOREOJWO_WRANGLER_CLI" dev --config dist/server/wrangler.json --local --persist-to .wrangler/state --ip 127.0.0.1 --inspector-port 0 --port 4173 --log-level debug > "$RUNNER_TEMP/yeoreojwo-http-server.log" 2>&1 &
          ci_server_pid=$!
          trap 'kill "$ci_server_pid" 2>/dev/null || true' EXIT
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { setTimeout } from 'node:timers/promises';
          let consecutiveHealthy = 0;
          let lastFailure = 'No healthy response yet';
          for (let attempt = 0; attempt < 60 && consecutiveHealthy < 10; attempt++) {
            try {
              const response = await fetch('http://127.0.0.1:4173/api/platform', { signal: AbortSignal.timeout(2000) });
              const snapshot = await response.json();
              if (!response.ok || !Array.isArray(snapshot.requests) || !snapshot.serverTime) {
                throw new Error(`API readiness returned HTTP ${response.status}`);
              }
              consecutiveHealthy++;
            } catch (error) {
              consecutiveHealthy = 0;
              lastFailure = String(error);
            }
            await setTimeout(500);
          }
          if (consecutiveHealthy < 10) throw new Error(`Local HTTP API did not stabilize: ${lastFailure}`);
          const probeHeaders = {
            'Content-Type': 'application/json',
            Origin: 'http://127.0.0.1:4173',
            'oai-authenticated-user-id': 'ci-read-only-diagnostic',
            'oai-authenticated-user-email': 'ci-read-only-diagnostic@example.invalid',
          };
          const invalidBodies = [
            ['{', 'INVALID_JSON'],
            ['{"action":"diagnostic-unknown","requestId":"no-record"}', 'INVALID_ACTION'],
          ];
          async function expectRejection(body, expectedStatus, expectedCode, headers = probeHeaders) {
            const response = await fetch('http://127.0.0.1:4173/api/platform', {
              method: 'POST', headers, body, signal: AbortSignal.timeout(5000),
            });
            const raw = await response.text();
            assert.equal(response.status, expectedStatus, `Expected ${expectedCode}, got ${response.status}: ${raw.slice(0,300)}`);
            assert.equal(JSON.parse(raw).code, expectedCode);
          }
          for (const [body, expectedCode] of invalidBodies) {
            await expectRejection(body, 400, expectedCode);
            console.log('PASS invalid HTTP body:', expectedCode);
          }
          // Each early rejection must leave the next POST usable. The 8 KiB body
          // exposes the observed unread-body connection loss; no request is retried.
          // All probes reject before any database mutation.
          const unreadBody = JSON.stringify({ action: 'profile', nickname: '연결검사', padding: 'x'.repeat(8192) });
          const anonymousHeaders = { 'Content-Type': 'application/json', Origin: probeHeaders.Origin };
          for (let round = 0; round < 10; round++) {
            await expectRejection(unreadBody, 401, 'SIGN_IN_REQUIRED', anonymousHeaders);
            await expectRejection('{', 400, 'INVALID_JSON');
            await expectRejection(unreadBody, 403, 'INVALID_ORIGIN', { ...probeHeaders, Origin: 'https://wrong.example' });
            await expectRejection('{', 400, 'INVALID_JSON');
          }
          console.log('PASS early-rejection connection regression: 20 consecutive rejection/follow-up pairs');
          NODE
          npm run test:http -- http://127.0.0.1:4173
      - name: Show local server diagnostics on failure
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/yeoreojwo-http-server.log" ]; then
            tail -n 300 "$RUNNER_TEMP/yeoreojwo-http-server.log"
          fi
